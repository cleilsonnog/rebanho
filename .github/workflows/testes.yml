# Confere cada push e cada PR (inclusive os do Dependabot): lint, tipos e os testes de segurança.
# Precisa dos segredos TEST_DATABASE_URL e TEST_DIRECT_URL (branch "testes" da Neon, nunca a produção)
# em Settings › Secrets and variables › Actions, e os mesmos em › Dependabot. Veja tests/README.md.
name: Testes

on:
  push:
    branches: [master]
  pull_request:

# Um push novo no mesmo PR cancela a execução anterior dele. Execuções diferentes rodam juntas no banco de
# testes: cada uma usa as próprias igrejas (tests/helpers.ts › PREFIXO).
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Migrações novas entram no banco de testes antes dos testes (a produção continua com você).
      - name: Migrações no banco de testes
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      - run: npm test
