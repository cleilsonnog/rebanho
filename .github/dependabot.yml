# Atualizações automáticas de dependências (PRs abertos pelo Dependabot).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    # Junta atualizações pequenas num PR só, para não lotar a caixa.
    groups:
      menores:
        update-types: [minor, patch]
  # As ações usadas em .github/workflows (checkout, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
